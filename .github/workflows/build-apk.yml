name:ShamsiCalendar

 on: workflow_dispatch:
  push:
    paths:
      - 'ShamsiCalendar-android-widget-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q ShamsiCalendar-android-widget-source.zip -d .

      - name: Build APK
        run: gradle --no-daemon -p ShamsiCalendar :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ShamsiCalendar-APK
          path: ShamsiCalendar/app/build/outputs/apk/debug/app-debug.apk
